# wxmp bundle layer: 注册模型工具 `wxmp`，同时由 client.js 提供左侧栏入口与三栏工作台，
# 并把本包自带的 skills\wxmp\SKILL.md 挂进会话技能目录。
# cliPath 留空时自动定位 ../bin/wxmp.js；stateDir 留空则用 CLI 自己的目录
# （%LOCALAPPDATA%\wxmp，不可写退回 <cwd>\.wxmp）。
#
# 这里的 config 必须与 index.js 的 DEFAULTS 逐字一致：两处不一致时以本文件为准，
# 因为它是实际装载值。logLevel 可选 debug/info/warn/error；日志与 mount-state.json
# 都落在 <stateDir>\logs，出问题先读那两个文件，不要靠复现。
#
# 注意：这里**不写** `!!js` 条件修饰 —— 插件管理器启停会把行改写成 `disabled: false`，
# 覆盖条件并导致安装回滚。开关判断放在 apply() 里做。
- insert:
    - id: wxmp
      name: '@local/wxmp'
      config:
        cliPath: ''
        stateDir: ''
        timeoutMs: 120000
        logLevel: 'info'
        logMaxBytes: 2097152

    # 随包 Skill 根：把 <本包>/skills/wxmp/SKILL.md 挂进会话技能目录。
    #
    # 少了这一行，skills/ 目录就是死文件：磁盘上有、目录里没有、模型永远看不到，
    # 而且不报任何错。dsh.client 只负责面板，不负责技能发现 —— 「装了没反应」就是这么来的。
    #
    # 路径必须从**安装位置**推导，不能写死：npm 装 / GitHub 装 / 本地 link 三种形态下
    # 包根各不相同，写死就只在作者这台机器上对。baseUrl 是 Loader 给的 profile 根。
    #
    # 取法：resolve 包入口再取 dirname 拼 'skills'（本包 exports 已导出 "./package.json"，
    # 直接 resolve('<pkg>/package.json') 也能用，但取入口这种写法对 exports 变更更耐受）。
    # anchors 覆盖 baseUrl 带不带尾斜杠两种写法；specs 覆盖发布名与安装名两种叫法。
    #
    # 表达式必须写成**单行 plain scalar**：YAML 会把多行 plain scalar 折成一行，
    # 行内的 `//` 注释会把后半段整段吞掉。winpilot / archify / humanizer-ru 三条先例也是单行。
    # 注：这里用的是**值**上的 `!!js`（config.* 的值不在启停改写路径上），
    # 与文件头那条「不给开关行加条件修饰」的警告不冲突。
    - id: wxmp-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: wxmp-plugin
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js (()=>{var P=process.getBuiltinModule('node:path'),M=process.getBuiltinModule('node:module'),U=process.getBuiltinModule('node:url'),b=String(baseUrl||''),A=[b,b+'/',b+'\\'],S=['@local/wxmp','wxmp'];for(var i=0;i<A.length;i++){if(!A[i])continue;for(var j=0;j<S.length;j++){try{return P.join(P.dirname(M.createRequire(A[i]).resolve(S[j])),'skills')}catch(e){}}}var r=b;if(r.indexOf('file:')===0){try{r=U.fileURLToPath(r)}catch(e){}}return P.join(r,'node_modules','@local','wxmp','skills')})()
